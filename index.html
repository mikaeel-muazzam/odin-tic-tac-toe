<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | The Odin Project</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script defer src="./scripts/script.js"></script>
</head>
<body>
    <h1>Tic Tac Toe | The Odin Project</h1>
    <form id="startGame" class="game-controls">
        <ul>
            <li>
                <label for="playerOne">PLAYER ONE NAME</label>
            </li>
            <li>
                <input type="text" id="playerOne" name="playerOne" placeholder="cool name">
            </li>
        </ul>
        <ul>
            <li>
                <label for="playerTwo">PLAYER TWO NAME</label>
            </li>
            <li>
                <input type="text" id="playerTwo" name="playerTwo" placeholder="cooler name">
            </li>
        </ul>
        <ul>
            <li>
                <button type="submit">Start</button>
            </li>
        </ul>
    </form>
    <div class="ttt-container"></div>
</body>
</html>
